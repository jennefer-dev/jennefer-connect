name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    # The org's own runner, like the other Jennefer repos.
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
