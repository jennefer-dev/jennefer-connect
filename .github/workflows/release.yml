# Publishes to npm when a version tag (v0.1.1, v0.2.0, ...) is pushed.
# Uses npm Trusted Publishing (OIDC): no npm token is stored in GitHub. Set it up once on npmjs.com:
#   @jennefer-dev/connect > Settings > Trusted Publisher > GitHub Actions
#   Organization: jennefer-dev, Repository: jennefer-connect, Workflow: release.yml
# npm adds a provenance statement automatically.
# This job must stay on a GitHub-hosted runner: npm Trusted Publishing does not support self-hosted runners yet.
# On a private repo it uses GitHub Actions minutes; on a public repo it is free.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@latest
      - run: npm ci
      - name: Check the tag matches package.json
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm test
      - run: npm publish --access public
